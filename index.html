<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="./" />
  <link rel="icon" href="./favicon.ico" sizes="any" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./favicon.ico" sizes="any" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="styleSheet" href="./styles/styles.css" type="text/css" />

  <title>Color Mini Apps</title>
  <meta name="description" content="Color Mini Apps" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>

<body class="light">

  <header>

    <div class="mini-app-name">
      <img class="apps-icon pixel" src="./favicon.ico" title="web icon - color roulette" />
      <h1>
        Color Mini Apps
      </h1>
    </div>

  </header>

  <main class="container">
    <div id="mini-apps-container" class="card-container"></div>
  </main>

  <footer></footer>

  <script>
    const miniApps = [
      { name: "Matrix Map Generator", unicode: "🪟", folder: "matrix-map" }, //▦ 𝄜 𝄝 🏻  🏼🏽 🏾🏿 🏁
      { name: "Ms Colors Organizer", unicode: "📚", folder: "ms-colors-sort" }, //📂
      { name: "Color Contrast Checker", unicode: "🎨", folder: "contrast-check" }, //🎨📝☑️✔️✅
    ];

    const createSelector = () => {
      /** @type HTMLDivElement */
      const container = document.getElementById("mini-apps-container");

      miniApps.map(app => {
        /** @type HTMLAnchorElement */
        const btn = document.createElement("a");
        /** @type HTMLHeadingElement */
        const title = document.createElement("h4");
        /** @type HTMLDivElement */
        const unicode = document.createElement("div");

        btn.href = `./${app.folder}/`;
        btn.className = "card card-small btn";
        title.textContent = app.name;
        unicode.textContent = app.unicode;
        unicode.className = "big-icon";

        btn.appendChild(unicode);
        btn.appendChild(title);
        container.appendChild(btn);
      });
    };

    createSelector();
  </script>
</body>

</html>
