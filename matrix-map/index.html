<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="./" />
  <link rel="icon" href="./../favicon.ico" sizes="any" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./../favicon.ico" sizes="any" type="image/svg+xml" />
  <link rel="manifest" href="./../manifest.webmanifest" />
  <link rel="styleSheet" href="./../styles/styles.css" type="text/css"/>

  <title>Editor de Matriz</title>
  <meta name="description" content="Color Mini Apps" />
  <link rel="stylesheet" href="./styles.css" media="screen" />
</head>

<body class="light">

  <header>
    <nav>
      <a class="btn btn-icon" href="./../" id="btn-main-menu">
        <img class="apps-icon pixel" src="./../favicon.ico" title="return to main menu"/>
        <span><</span>
      </a>
    </nav>
    <div class="mini-app-name">
      <span class="apps-icon">🪟</span>
      <h1>Matrix Map Generator</h1>
    </div>
  </header>

  <div class="container">
    <section class="col card">

      <div class="row">
        <h4>Modo</h4>

        <div class="btn-select">
          <button class="btn-text" id="btn-mode-console" onclick="changeCellMode('CONSOLE')">Consola</button>
          <button class="btn-text" id="btn-mode-tilemap" onclick="changeCellMode('TILEMAP')">Tilemap</button>
        </div>
      </div>

      <div class="row">
        <h4>Paleta</h4>
        <div id="palette"></div>
      </div>

      <!-- <div class="row">
        <h4>Celda</h4>

        <div class="row input">
          <label for="cell-width">Ancho:</label>
          <input id="cell-width" type="number" value="8" min="1" , max="25" />
        </div>

        <div class="row input">
          <label for="cell-height">Alto:</label>
          <input id="cell-height" type="number" value="16" min="1" , max="25" />
        </div>

        <button onclick="updateCellSize()" class="btn-text">
          Actualizar
        </button>
      </div> -->

      <div class="row">
        <h4>Matriz</h4>

        <div class="row input">
          <label for="width">Ancho:</label>
          <input id="width" type="number" value="120" min="1" , max="200" />
        </div>

        <div class="row input">
          <label for="height">Alto:</label>
          <input id="height" type="number" value="30" min="1" , max="100" />
        </div>

        <button onclick="createMatrix()" class="btn btn-text">
          Generar
        </button>
      </div>
    </section>
  </div>

  <section>
    <div id="grid"></div>
  </section>

  <section class="col">
    <button id="copy-btn" onclick="copyMatrix()" class="btn-text">Copiar matriz</button>
    <pre id="output"></pre>
  </section>

  <script src="./palette.js"></script>
  <script src="./script.js"></script>

</body>

</html>
