<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="./" />
  <link rel="icon" href="./../favicon.ico" sizes="any" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./../favicon.ico" sizes="any" type="image/svg+xml" />
  <link rel="manifest" href="./../manifest.webmanifest" />
  <link rel="styleSheet" href="./../styles/styles.css" type="text/css"/>

  <title>Editor de Matriz</title>
  <meta name="description" content="Color Mini Apps" />
  <link rel="stylesheet" href="./styles.css" media="screen" />
</head>

<body class="light">

  <header>
    <nav>
      <a class="btn btn-icon" href="./../" id="btn-main-menu">
        <img class="apps-icon pixel" src="./../favicon.ico" title="return to main menu"/>
        <span><</span>
      </a>
    </nav>
    <div class="mini-app-name">
      <span class="apps-icon">🪟</span>
      <h1>Matrix Map Generator</h1>
    </div>
    <div id="theme">
      <button title="light mode" id="theme-light" class="btn-icon" onclick="Theme.SetMode('light')">⛭</button>
      <button title="dark mode" id="theme-dark" class="btn-icon" onclick="Theme.SetMode('dark')">☾</button>
    </div>
  </header>
  
  <div class="container">
    <section class="card-container">
  
      <div class="col card">
        <div class="row">
          <h4>Mode</h4>
  
          <div class="btn-select">
            <button id="btn-mode-console" onclick="changeCellMode('CONSOLE')">Console</button>
            <button id="btn-mode-tilemap" onclick="changeCellMode('TILEMAP')">Tilemap</button>
          </div>
        </div>
  
  
        <div class="row">
          <h4>Matrix</h4>
  
          <div class="row input">
            <label for="width">Width
              <span class="adv">max 256</span>
            </label>
            <input id="width" type="number" value="100" min="1" max="256" placeholder="max 256" />
          </div>
  
          <div class="row input">
            <label for="height">Height
              <span class="adv">max 128</span>
            </label>
            <input id="height" type="number" value="30" min="1" max="128" placeholder="max 128" />
          </div>
  
          <button onclick="updateMatrix()" class="primary">
            Create
          </button>
        </div>
  
        <div>
          <div class="row">
            <label for="image-input">
              Or upload a pixel map
              <span class="adv">It will scale until width 256 and / or 128 height</span>
            </label>
            <input id="image-input" type="file" accept="image/*" class="secondary"/>
            <canvas id="canvas" style="display:none"></canvas>
          </div>
        </div>
  
        <div class="row">
          <button onclick="scaleCellSize(this, false)" id="scale-down">
            🔎 -
          </button>
          <span id="scale">1.0</span>
          <button onclick="scaleCellSize(this, true)" id="scale-up">
            🔍 +
          </button>
        </div>
      </div>
  
    </section>
  </div>

  <section>

    <div class="row">
      <button onclick="cleanMatrix()" title="Clear" class="btn-icon-text">
        🧹
      </button>
      <div id="palette"></div>
    </div>

    <div id="grid"></div>
  </section>

  <section class="col">
    <button id="copy-btn" onclick="copyMatrix()">Copy matrix</button>
    <pre id="output"></pre>
  </section>

  <script src="./../scripts/script.js"></script>
  <script src="./scripts/palette.js"></script>
  <script src="./scripts/matrix.js"></script>
  <script src="./scripts/paint-grid.js"></script>
  <script src="./scripts/script.js"></script>

</body>

</html>
