<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 Círculo Cromático Interactivo</title>
<link rel="styleSheet" href="./../styles.css" type="text/css" media="screen"/>
<style>
  :root {
    --background-color: #f3f3f3;
    --text-color: #222;
  }
  
  ::root .dark {
    --background-color: #1e1e1e;
    --text-color: #f0f0f0;
  }

  body {
    font-family: Calibri, sans-serif;
    display: flex;
    flex-direction: row;
    background: var(--background-color);
    color: var(--text-color);
    flex-wrap: wrap;
    justify-content: space-evenly;
    padding: 2rem;
    gap: 3rem;
  }

  h2 {
    width: 100%;
    margin-bottom: 0.5rem;
  }
  h2, h3 {
    text-align: center;
  }

  input[type=range] {
    --thumb-color: rgba(0,0,0,0.67);
    --thumb-border: 2px solid #fff;
    --thumb-size: 1rem;
    --thumb-shadow: 0 0 5px rgba(0,0,0,0.3);

    -webkit-appearance: none;
    width: 100%;
    height: 0.25rem;
    border-radius: 0.125rem;
    background: var(--background-color);
    box-shadow: 0 -2px 2px rgba(255, 255, 255, 0.33) inset, 0 2px 2px rgba(0, 0, 0, 0.33) inset;
    outline: none;
    padding: 0;
    margin: 0.5rem 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: var(--thumb-size);
    height: var(--thumb-size);
    background: var(--thumb-color);
    border: var(--thumb-border);
    box-shadow: var(--thumb-shadow);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    background: var(--thumb-color);
  }
  input[type=range]::-moz-range-thumb {
    width: var(--thumb-size);
    height: var(--thumb-size);
    background: var(--thumb-color);
    border: var(--thumb-border);
    box-shadow: var(--thumb-shadow);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .dot {
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 2px rgba(0,0,0,0.5);
  }
  .box {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    box-shadow: 0 -2px 2px -1px rgba(255, 255, 255, 0.33), 0 2px 2px -1px rgba(0, 0, 0, 0.33);
  }
  .dot, .box {
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    pointer-events: all;
  }
  .dot:hover, .box:hover {
    transform: scale(1.1);
    z-index: 10;
  }
  .dot:hover  {
    box-shadow: 0 0 3px rgba(0,0,0,0.75);
  }

  .tooltip {
    position: absolute;
    background: #333;
    color: #fff;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
    z-index: 100;
  }

  section {
    z-index: 1;
    position: relative;
  }

  section.chromatic {
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    /* align-items: center; */
    justify-content: center;
    column-gap: 2rem;
    row-gap: 0.75rem;
  }
  
  .chr-settings {
    display: flex;
    gap: 2rem;
  }
  .chr-settings label {
    display: flex;
    column-gap: 1rem;
    row-gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
    padding: 0.5rem;
  }
  .chr-settings .row {
    display: flex;
    align-items: center;
    column-gap: 0.5rem;
  }

  .chr-container {
    position: relative;
  }

  .circle-container {
    width: 600px;
    height: 600px;
    border-radius: 50%;
    margin-bottom: 0px;
    pointer-events: none;
  }

  .levels-container {
    position: absolute;
  }
  .level {
    position: absolute;
    border-radius: 50%;
    border: 1px solid #fff;
    box-shadow: 0 0 2px rgba(0,0,0,0.5);
  }
  
  svg.sector-container {
    position: absolute;
    top: 0;
    left: 0;
    /* filter: drop-shadow(0 0 1px rgba(0,0,0,0.25)); */
  }
  .sector {
    fill: rgba(0, 0, 0, 0);
    stroke: rgba(255, 255, 255, 0.5);
    stroke-width: 1;
    pointer-events: all;
    cursor: pointer;
    transition: fill 0.2s;
  }
  .active-sector {
    fill: rgba(0, 0, 0, 0.1);
    stroke: rgba(255, 255, 255, 1);
  }

  .list {
    display: flex;
    flex-wrap: wrap;
    flex-direction: row;
    column-gap: 0.5rem;
    row-gap:  0.25rem;
  }
  .item {
    padding: 0.5rem 0.75rem;
    width: 9rem; /*12rem*/
    display: flex;
    gap: 0.33rem;
    cursor: default;
    border-radius: 1rem;
    align-items: center;
  }

  .fill-flex {
    flex: 1 1 0;
  }
  
  .gray-cont {
    max-width: 800px;
  }
  .gray-cont .list {
    flex-direction: column;
  }

  @media screen and (max-width: 900px) {
    .gray-cont .list {
      flex-direction: row;
    }
  }

</style>
</head>

<body>
  <div class="tooltip" id="tooltip"></div>
  
  <section class="gray-cont">
    <h2>🖤 Grises</h2>
    <div class="list" id="grayList"></div>
  </section>

  <section class="chromatic fill-flex">
    <h2>🌈 Círculo Cromático</h2>
    <div class="chr-settings">
      <label>
        <span>Tamaño de círculo</span>
        <div class="row">
          <span>10</span>
          <input id="dot-radius" type="range" value="15" min="10" max="40" step="5"/>
          <span>40</span>
        </div>
      </label>
      <label>
        <span>Niveles</span>
        <div class="row">
          <span>0</span>
          <input id="levels" type="range" value="0" min="0" max="15" step="1"/>
          <span>15</span>
        </div>
      </label>
      <label>
        <span>Sectores</span>
        <div class="row">
          <span>6</span>
          <input id="sectors" type="range" value="3" min="6" max="18" step="3"/>
          <span>18</span>
        </div>
      </label>
    </div>

    <div class="chr-container">
      <div class="circle-container levels-container" id="levelsContainer"></div>
      <svg class="circle-container sector-container" id="sectorSvg"></svg>
      <div class="circle-container" id="circleContainer"></div>
    </div>

    <div class="chr-selected fill-flex">
      <h3>Sección seleccionada</h3>
      <div class="list" id="colorList"></div>
    </div>
  </section>

// from https://learn.microsoft.com/en-us/dotnet/api/system.windows.media.brushes?view=windowsdesktop-9.0

// Convertir hex a HSL
function hexToHSL(H){
    let r = 0, g = 0, b = 0;
    if(H.length == 4){
      r = "0x"+H[1]+H[1];
      g = "0x"+H[2]+H[2];
      b = "0x"+H[3]+H[3];
    } else if (H.length == 7){
      r = "0x"+H[1]+H[2];
      g = "0x"+H[3]+H[4];
      b = "0x"+H[5]+H[6];
    }
    r /= 255; g /= 255; b /= 255;
    
    const cmin = Math.min(r,g,b);
    const cmax = Math.max(r,g,b);
    const delta = cmax - cmin;
    let h = 0, s = 0, l = 0;

    if(delta === 0) h = 0;
    else if(cmax === r) h = ((g - b)/delta) % 6;
    else if(cmax === g) h = (b - r)/delta + 2;
    else h = (r - g)/delta + 4;
    h = Math.round(h*60);
    if(h < 0) h += 360;
    
    l = (cmax + cmin)/2;
    s = delta === 0 ? 0 : delta/(1 - Math.abs(2 * l - 1));
    s = +(s * 100).toFixed(1);
    l = +(l * 100).toFixed(1);
    return {h,s,l};
}

// Función para luminosidad
function luminance(hex) {
  const r = parseInt(hex.substr(1,2),16)/255;
  const g = parseInt(hex.substr(3,2),16)/255;
  const b = parseInt(hex.substr(5,2),16)/255;
  return 0.299*r + 0.587*g + 0.114*b;
}

// Ordenar por Hue y luego Luminosidad
colors.forEach(c => {
  const hsl = hexToHSL(c.hex);
  c.hsl = hsl;
});
colors.sort((a,b) => a.hsl.h - b.hsl.h || a.hsl.l - b.hsl.l);

// Tooltip
const tooltip = document.getElementById('tooltip');
/** @param value {boolean} */
const ShowTooltip = (value) => {
  tooltip.style.opacity = value ? 1 : 0;
  tooltip.style.display = value ? "block" : "none";
  tooltip.hidden = !value;
};
// Posicionar tooltip
document.addEventListener('mousemove', e => {
  if (!tooltip.hidden)
  {
    tooltip.style.left = (e.pageX + 10) + 'px';
    tooltip.style.top = (e.pageY + 10) + 'px';
  }
});

// Inputs
const dotRadiusInput = document.getElementById("dot-radius");
const levelInput = document.getElementById('levels');
const sectorsInput = document.getElementById('sectors');

/** @param c {{name, hex, hsl}} */
const CreateItem = (c) => {
  const item = document.createElement('div');
  item.style.background = c.hex;

  item.addEventListener('click', () => {
    navigator.clipboard.writeText(c.name);
    tooltip.innerText = `Copiado: ${c.name}`;
    // tooltip.style.backgroundColor = c.hex;
    // tooltip.style.color = luminance(c.hex) > 0.42 ? 'black' : 'white'; //may use hsl
    // tooltip.style.opacity = 1;
    setTimeout(() => tooltip.style.opacity = 0, 1000);
  });
  
  item.addEventListener('mouseenter', () => {
    tooltip.innerText = `${c.name} ${c.hex}`;
    tooltip.style.backgroundColor = c.hex;
    tooltip.style.color = luminance(c.hex) > 0.55 ? 'black' : 'white';
    ShowTooltip(true);
  });
  
  item.addEventListener('mouseleave', () => ShowTooltip(false));

  return item;
};

let dotRadius = parseInt(dotRadiusInput.value);
/** @param c {{name, hex, hsl}} */
const CreateDot = (c) => {
  const dot = CreateItem(c);
  dot.className = 'dot';
  dot.style.width = dotRadius + 'px';
  dot.style.height = dotRadius + 'px';
  return dot;
};

const CreateBox = (c) => {
  const box = CreateItem(c);
  box.className = 'box item';
  
  const label = document.createElement("span");
  label.innerText = c.name;
  label.style.color = luminance(c.hex) > 0.55 ? 'black' : 'white';

  box.appendChild(label);
  return box;
};

// Separar grises
const grayColors = colors.filter(c => {
  const h = c.hex.replace('#','');
  const r = parseInt(h.substr(0,2),16);
  const g = parseInt(h.substr(2,2),16);
  const b = parseInt(h.substr(4,2),16);
  return r === g && g === b;
});

// Colores para círculo
const chromaColors = colors.filter(c => !grayColors.includes(c));

// Crear círculo cromático
const center = 300;

// Crear sectores en SVG
let activeSector = 0;
let sections = parseInt(sectorsInput.value);
const svg = document.getElementById('sectorSvg');
const list = document.getElementById('colorList');
const CreateSectors = () => {
  const sectionAngle = 360 / sections;
  const radius = center - dotRadius * 0.5;
  
  for (let i = 0; i < sections; i++) {
    const start = (i * sectionAngle) * Math.PI / 180;
    const end = ((i+1) * sectionAngle) * Math.PI / 180;
    const x1 = center + radius * Math.cos(start);
    const y1 = center + radius * Math.sin(start);
    const x2 = center + radius * Math.cos(end);
    const y2 = center + radius * Math.sin(end);
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const d = `M${center},${center} L${x1},${y1} A${radius},${radius} 0 0,1 ${x2},${y2} Z`;
    path.setAttribute("d", d);
    path.classList.add("sector");
    path.dataset.index = i;

    // Triángulo activo
    path.addEventListener("click", ()=> {
      activeSector = path.dataset.index;
      document.querySelectorAll(".sector").forEach(s=>s.classList.remove("active-sector"));
      const selected = document.querySelector(`.sector[data-index="${path.dataset.index}"]`);
      selected.classList.add("active-sector");
      
      // updateColorList
      list.innerHTML = "";
      const minAngle = activeSector * sectionAngle;
      const maxAngle = minAngle + sectionAngle; //(activeSector + 1) * sectionAngle
      const filtered = chromaColors.filter(c => c.hsl.h >= minAngle && c.hsl.h < maxAngle);
      filtered.forEach(c=>{
        list.appendChild(CreateBox(c));
      });
    });
    
    svg.appendChild(path);
  }
}
CreateSectors();

// Crear cícurlo
const container = document.getElementById('circleContainer');
const levelsContainer = document.getElementById('levelsContainer');

const CreateChromaticCircle = () => {
  const radiusCenter = -dotRadius * 2;
  const maxRadius = center + dotRadius;
  
  const levels = parseInt(levelInput.value);
  
  if (levels > 0) {
    for (let index = 1; index <= levels; index++) {
      const levelCircle = document.createElement('div');
      const radius = (index / levels) * maxRadius + radiusCenter;
      levelCircle.className = "level";
      levelCircle.style.width = `${radius * 2}px`;
      levelCircle.style.height = `${radius * 2}px`;
      levelCircle.style.left = `${center - radius}px`
      levelCircle.style.top = `${center - radius}px`
      levelsContainer.appendChild(levelCircle)
    }
  }

  chromaColors.forEach((c, i) => {
    let radius;
    if (levels > 0) {
      const radiusIndex = Math.floor(c.hsl.l / (100 / levels));
      radius = ((radiusIndex + 1) / levels) * maxRadius + radiusCenter;
    }
    else {
      radius = Math.floor((c.hsl.l / 100) * maxRadius) + radiusCenter;
    }
    const angle = (c.hsl.h / 360) * 2 * Math.PI;

    const dot = CreateDot(c);
    dot.style.position = "absolute";
    dot.style.left = `${center + radius * Math.cos(angle) - dotRadius * 0.5 - 1}px`;
    dot.style.top = `${center + radius * Math.sin(angle) - dotRadius * 0.5 - 1}px`;
    container.appendChild(dot);
  });
}

// onload
levelInput.value = localStorage.getItem("ChromaticLevel");
dotRadiusInput.value = localStorage.getItem("ChromaticDotRadius");
sectorsInput.value = localStorage.getItem("NumSectors");


CreateChromaticCircle();
const ReloadChromaticCircle = () => {
  container.innerHTML = "";
  levelsContainer.innerHTML = "";
  CreateChromaticCircle();
}

/** @param inputElement {HTMLInputElement} */
const UpdateTooltipByInput = (inputElement) => {
  tooltip.innerText = `${inputElement.value === '0' ? 'auto' : inputElement.value}`;
  const alpha = (inputElement.value - inputElement.min) / (inputElement.max - inputElement.min);
  tooltip.style.backgroundColor = `rgba(0, 0, 0, ${0.25 + 0.75 * alpha})`;
  tooltip.style.color = 'white';
}

levelInput.addEventListener("input", ev => {
  localStorage.setItem("ChromaticLevel", levelInput.value);
  UpdateTooltipByInput(levelInput);
  ReloadChromaticCircle();
});
levelInput.addEventListener("mouseenter", ev => {
  UpdateTooltipByInput(levelInput);
  ShowTooltip(true);
});
levelInput.addEventListener("mouseleave", ev => {
  ShowTooltip(false);
});

dotRadiusInput.addEventListener("input", ev => {
  localStorage.setItem("ChromaticDotRadius", dotRadiusInput.value);
  dotRadius = parseInt(dotRadiusInput.value);
  UpdateTooltipByInput(dotRadiusInput);
  ReloadChromaticCircle();
});
dotRadiusInput.addEventListener("mouseenter", ev => {
  UpdateTooltipByInput(dotRadiusInput);
  ShowTooltip(true);
});
dotRadiusInput.addEventListener("mouseleave", ev => {
  ShowTooltip(false);
});

sectorsInput.addEventListener("input", ev => {
  localStorage.setItem("NumSectors", sectorsInput.value);
  sections = parseInt(sectorsInput.value);
  UpdateTooltipByInput(sectorsInput);
  svg.innerHTML = "";
  list.innerHTML = "";
  CreateSectors();
});
sectorsInput.addEventListener("mouseenter", ev => {
  UpdateTooltipByInput(sectorsInput);
  ShowTooltip(true);
});
sectorsInput.addEventListener("mouseleave", ev => {
  ShowTooltip(false);
});


// Grises
const grayList = document.getElementById('grayList');
grayColors.forEach(c => {
  grayList.appendChild(CreateBox(c));
});


// ===== Modo oscuro automático =====
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.body.classList.add("dark");
}
</script>
