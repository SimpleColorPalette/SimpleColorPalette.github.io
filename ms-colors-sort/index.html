<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Círculo Cromático Interactivo</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 20px;
    background: #f0f0f0;
  }

  .circle-container {
    position: relative;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    margin-bottom: 40px;
  }

  .color-dot {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 0 3px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tooltip {
    position: absolute;
    background: #333;
    color: #fff;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .gray-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    max-width: 800px;
  }

  .gray-dot {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #000;
  }
</style>
</head>
<body>

<h2>Círculo Cromático</h2>
<div class="circle-container" id="circleContainer"></div>
<div class="tooltip" id="tooltip"></div>

<h2>Grises y neutrales</h2>
<div class="gray-list" id="grayList"></div>

// Separar grises
const grayColors = colors.filter(c => {
  const h = c.hex.replace('#','');
  const r = parseInt(h.substr(0,2),16);
  const g = parseInt(h.substr(2,2),16);
  const b = parseInt(h.substr(4,2),16);
  return r === g && g === b;
});

// Colores para círculo
const chromaColors = colors.filter(c => !grayColors.includes(c));

// Convertir hex a HSL
function hexToHSL(H){
    let r = 0, g = 0, b = 0;
    if(H.length == 4){
      r = "0x"+H[1]+H[1];
      g = "0x"+H[2]+H[2];
      b = "0x"+H[3]+H[3];
    } else if(H.length == 7){
      r = "0x"+H[1]+H[2];
      g = "0x"+H[3]+H[4];
      b = "0x"+H[5]+H[6];
    }
    r /= 255; g /= 255; b /= 255;
    const cmin = Math.min(r,g,b);
    const cmax = Math.max(r,g,b);
    const delta = cmax - cmin;
    let h = 0, s = 0, l = 0;

    if(delta === 0) h = 0;
    else if(cmax === r) h = ((g - b)/delta) % 6;
    else if(cmax === g) h = (b - r)/delta + 2;
    else h = (r - g)/delta + 4;
    h = Math.round(h*60);
    if(h < 0) h += 360;
    l = (cmax + cmin)/2;
    s = delta === 0 ? 0 : delta/(1-Math.abs(2*l-1));
    s = +(s*100).toFixed(1);
    l = +(l*100).toFixed(1);
    return {h,s,l};
}

// Ordenar por Hue y luego Luminosidad
chromaColors.forEach(c => {
  const hsl = hexToHSL(c.hex);
  c.hsl = hsl;
});

chromaColors.sort((a,b) => a.hsl.h - b.hsl.h || a.hsl.l - b.hsl.l);

// Crear círculo cromático
const container = document.getElementById('circleContainer');
const tooltip = document.getElementById('tooltip');

const centerX = 300;
const centerY = 300;
const maxRadius = 250;
const levels = 9;

chromaColors.forEach((c, i) => {
  const radiusIndex = Math.floor(c.hsl.l / (100/levels));
  const radius = (radiusIndex / levels) * maxRadius + 30;
  const angle = (c.hsl.h/360)*2*Math.PI;

  const dot = document.createElement('div');
  dot.className = 'color-dot';
  dot.style.background = c.hex;
  dot.style.left = `${centerX + radius*Math.cos(angle) - 20}px`;
  dot.style.top = `${centerY + radius*Math.sin(angle) - 20}px`;

  dot.addEventListener('click', () => {
    navigator.clipboard.writeText(c.name);
    tooltip.innerText = `Copiado: ${c.name}`;
    tooltip.style.opacity = 1;
    setTimeout(() => tooltip.style.opacity = 0, 1000);
  });

  container.appendChild(dot);
});

// Posicionar tooltip
document.addEventListener('mousemove', e => {
  tooltip.style.left = (e.pageX + 10) + 'px';
  tooltip.style.top = (e.pageY + 10) + 'px';
});

// Grises
const grayList = document.getElementById('grayList');
grayColors.forEach(c => {
  const dot = document.createElement('div');

  dot.style.background = c.hex;
  dot.addEventListener('click', () => {
    navigator.clipboard.writeText(c.name);
    tooltip.innerText = `Copiado: ${c.name}`;
    tooltip.style.opacity = 1;
    setTimeout(() => tooltip.style.opacity = 0, 1000);
  });
  grayList.appendChild(dot);
});
