<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paletas Microsoft Brushes - Buscador</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #fafafa;
    color: #222;
    margin: 0;
    padding: 2rem;
  }

  h1 {
    text-align: center;
    margin-bottom: 1rem;
  }

  input[type="text"] {
    display: block;
    margin: 0 auto 2rem auto;
    padding: 0.6rem 1rem;
    font-size: 1rem;
    width: 90%;
    max-width: 400px;
    border: 2px solid #ccc;
    border-radius: 6px;
  }

  h2 {
    margin-top: 2.5rem;
    color: #333;
    border-bottom: 3px solid #ccc;
    padding-bottom: 0.3rem;
  }

  .palette {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 1rem;
  }

  .swatch {
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.1);
    overflow: hidden;
    background: #fff;
    transition: transform 0.15s ease-in-out;
  }

  .swatch:hover {
    transform: scale(1.05);
  }

  .swatch-color {
    height: 60px;
  }

  .swatch-label {
    padding: 6px;
    font-size: 0.8rem;
    text-align: center;
    background: rgba(255,255,255,0.8);
  }

  .swatch-label code {
    display: block;
    color: #666;
    font-size: 0.7rem;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>

<h1>🎨 Microsoft Brushes con Buscador</h1>
<input type="text" id="search" placeholder="Buscar color (ej: blue, red, gray...)" />

<!-- CONTENEDOR DE COLORES -->
<div id="all-palettes">

  <h2>🟥 Cálidos</h2>
  <div class="palette" id="warm"></div>

  <h2>🟦 Fríos</h2>
  <div class="palette" id="cool"></div>

  <h2>💜 Púrpuras / Rosados</h2>
  <div class="palette" id="purple"></div>

  <h2>⚫ Neutros / Grises</h2>
  <div class="palette" id="neutral"></div>

  <h2>🟩 Verdes / Terrosos</h2>
  <div class="palette" id="green"></div>

</div>

<script>
const colors = {
  warm: [
    ["Red","#ff0000"],["OrangeRed","#ff4500"],["Orange","#ffa500"],["DarkOrange","#ff8c00"],
    ["Tomato","#ff6347"],["Coral","#ff7f50"],["Salmon","#fa8072"],["LightSalmon","#ffa07a"],
    ["Gold","#ffd700"],["Goldenrod","#daa520"],["Peru","#cd853f"],["Chocolate","#d2691e"],
    ["Brown","#a52a2a"],["SaddleBrown","#8b4513"],["Sienna","#a0522d"],["Tan","#d2b48c"],
    ["Khaki","#f0e68c"],["IndianRed","#cd5c5c"],["RosyBrown","#bc8f8f"],["PeachPuff","#ffdab9"],
    ["AntiqueWhite","#faebd7"],["Bisque","#ffe4c4"],["BlanchedAlmond","#ffebcd"],["Wheat","#f5deb3"]
  ],
  cool: [
    ["Blue","#0000ff"],["DarkBlue","#00008b"],["MediumBlue","#0000cd"],["MidnightBlue","#191970"],
    ["Navy","#000080"],["DodgerBlue","#1e90ff"],["CornflowerBlue","#6495ed"],["SkyBlue","#87ceeb"],
    ["LightBlue","#add8e6"],["SteelBlue","#4682b4"],["Teal","#008080"],["DarkCyan","#008b8b"],
    ["Aquamarine","#7fffd4"],["Turquoise","#40e0d0"],["MediumTurquoise","#48d1cc"],["LightCyan","#e0ffff"],
    ["SpringGreen","#00ff7f"],["Chartreuse","#7fff00"],["Lime","#00ff00"],["LimeGreen","#32cd32"],
    ["MediumSeaGreen","#3cb371"],["SeaGreen","#2e8b57"],["DarkSeaGreen","#8fbc8f"],["PaleTurquoise","#afeeee"],
    ["LightSeaGreen","#20b2aa"],["DarkTurquoise","#00ced1"]
  ],
  purple: [
    ["Magenta","#ff00ff"],["DeepPink","#ff1493"],["HotPink","#ff69b4"],["Pink","#ffc0cb"],
    ["LightPink","#ffb6c1"],["Orchid","#da70d6"],["MediumOrchid","#ba55d3"],["Violet","#ee82ee"],
    ["Plum","#dda0dd"],["Purple","#800080"],["MediumPurple","#9370db"],["DarkOrchid","#9932cc"],
    ["MediumVioletRed","#c71585"],["PaleVioletRed","#db7093"],["BlueViolet","#8a2be2"],
    ["DarkViolet","#9400d3"],["Indigo","#4b0082"],["DarkMagenta","#8b008b"]
  ],
  neutral: [
    ["Black","#000000"],["DimGray","#696969"],["Gray","#808080"],["DarkGray","#a9a9a9"],
    ["LightGray","#d3d3d3"],["Silver","#c0c0c0"],["Gainsboro","#dcdcdc"],["WhiteSmoke","#f5f5f5"],
    ["GhostWhite","#f8f8ff"],["Ivory","#fffff0"],["Linen","#faf0e6"],["OldLace","#fdf5e6"],
    ["Snow","#fffafa"],["White","#ffffff"],["Transparent","#00ffffff"]
  ],
  green: [
    ["Olive","#808000"],["OliveDrab","#6b8e23"],["DarkOliveGreen","#556b2f"],["LawnGreen","#7cfc00"],
    ["LightGreen","#90ee90"],["PaleGreen","#98fb98"],["Green","#008000"],["DarkGreen","#006400"],
    ["GreenYellow","#adff2f"],["SeaShell","#fff5ee"]
  ]
};

function renderPalettes() {
  for (const group in colors) {
    const container = document.getElementById(group);
    colors[group].forEach(([name, hex]) => {
      const swatch = document.createElement("div");
      swatch.className = "swatch";
      swatch.dataset.name = name.toLowerCase();
      swatch.innerHTML = `
        <div class="swatch-color" style="background:${hex}"></div>
        <div class="swatch-label">${name}<code>${hex}</code></div>
      `;
      container.appendChild(swatch);
    });
  }
}

function setupSearch() {
  const input = document.getElementById("search");
  input.addEventListener("input", () => {
    const term = input.value.trim().toLowerCase();
    document.querySelectorAll(".swatch").forEach(swatch => {
      const match = swatch.dataset.name.includes(term);
      swatch.classList.toggle("hidden", !match && term);
    });
  });
}

renderPalettes();
setupSearch();
</script>
</body>
</html>
