<!DOCTYPE html>

<meta charset="UTF-8">

<title>Organizador de Microsoft Brushes Ajustado</title>
<style>
:root {
  --bg-light: #fafafa;
  --bg-dark: #1e1e1e;
  --text-light: #222;
  --text-dark: #f0f0f0;
  --swatch-size: 60px;
  --swatch-radius: 6px;
  --gap: 10px;
}

body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 2rem;
  background: var(--bg-light);
  color: var(--text-light);
  transition: background 0.3s, color 0.3s;
}

body.dark {
  background: var(--bg-dark);
  color: var(--text-dark);
}

h1 {
  text-align: center;
  margin-bottom: 1rem;
}

input[type="text"] {
  display: block;
  margin: 0 auto 1.5rem auto;
  padding: 0.6rem 1rem;
  font-size: 1rem;
  width: 90%;
  max-width: 400px;
  border-radius: 6px;
  border: 2px solid #ccc;
}

button {
  margin: 0 5px 1rem 0;
  padding: 0.5rem 1rem;
  font-size: 0.9rem;
  cursor: pointer;
  border-radius: 6px;
  border: none;
  background: #0078d7;
  color: white;
  transition: background 0.2s;
}

button:hover { background: #005a9e; }

h2 {
  /* margin-top: 2rem; */
  border-bottom: 2px solid #ccc;
  padding-bottom: 0.3rem;
}

.palette {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: var(--gap);
  margin-top: 0.5rem;
  min-height: var(--swatch-size);
}

.swatch {
  border-radius: var(--swatch-radius);
  border: 1px solid rgba(0,0,0,0.1);
  overflow: hidden;
  cursor: grab;
  transition: transform 0.15s ease-in-out;
  background: #fff;
}

.swatch:active {
  cursor: grabbing;
  transform: scale(1.05);
}

.swatch-color {
  height: var(--swatch-size);
}

.swatch-label {
  padding: 4px 6px;
  font-size: 0.8rem;
  text-align: center;
  background: rgba(255,255,255,0.8);
}

.swatch-label code {
  display: block;
  font-size: 0.7rem;
  color: #666;
}

.hidden { display: none !important; }

.family-container {
  /* margin-bottom: 2rem; */
  /* border: 2px dashed #ccc; */
  padding: 0.5rem;
  border-radius: 8px;
}
</style>

const palettesContainer = document.getElementById("palettes");
let swatchesData = {};

// ===== Crear paletas =====
function createPalettes(savedData) {
  palettesContainer.innerHTML = "";
  for (const family of Object.keys(savedData || colorFamilies)) {
    const container = document.createElement("div");
    container.className = "family-container";
    container.dataset.family = family;

    const h2 = document.createElement("h2");
    h2.textContent = family;
    container.appendChild(h2);

    const palette = document.createElement("div");
    palette.className = "palette";
    palette.dataset.family = family;
    container.appendChild(palette);

    const colors = savedData?.[family] || colorFamilies[family];
    swatchesData[family] = colors.map(([name, hex]) => ({name, hex}));

    colors.forEach(([name, hex]) => {
      const swatch = document.createElement("div");
      swatch.className = "swatch";
      swatch.draggable = true;
      swatch.dataset.name = name;
      swatch.innerHTML = `
        <div class="swatch-color" style="background:${hex}"></div>
        <div class="swatch-label">${name}<code>${hex}</code></div>
      `;
      // Click para copiar Color::<Nombre>
      swatch.addEventListener("click", () => {
        navigator.clipboard.writeText(`Color::${name}`);
        // alert(`Copiado: Color::${name}`);
      });
      palette.appendChild(swatch);
    });

    palettesContainer.appendChild(container);
  }
}

// ===== Drag & Drop dentro de la familia =====
let dragged = null;
document.addEventListener("dragstart", e => {
  if (e.target.classList.contains("swatch")) dragged = e.target;
});
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  if (!dragged) return;
  const targetPalette = e.target.closest(".palette");
  if (!targetPalette || targetPalette.dataset.family !== dragged.parentNode.dataset.family) return;
  const afterElement = getDragAfterElement(targetPalette, e.clientY);
  if (afterElement == null) targetPalette.appendChild(dragged);
  else targetPalette.insertBefore(dragged, afterElement);
  saveOrder();
  dragged = null;
});
function getDragAfterElement(container, y) {
  const elements = [...container.querySelectorAll(".swatch:not(.dragging)")];
  return elements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if (offset < 0 && offset > closest.offset) return {offset, element: child};
    return closest;
  }, {offset: Number.NEGATIVE_INFINITY}).element;
}

// ===== Guardar y cargar orden =====
function saveOrder() {
  const data = {};
  document.querySelectorAll(".family-container").forEach(container => {
    const family = container.dataset.family;
    const palette = container.querySelector(".palette");
    data[family] = [...palette.children].map(s => [s.dataset.name, s.querySelector(".swatch-color").style.background]);
  });
  swatchesData = data;
  localStorage.setItem("brushesOrder", JSON.stringify(data));
}
function loadOrder() {
  const data = localStorage.getItem("brushesOrder");
  return data ? JSON.parse(data) : null;
}
document.getElementById("reset").addEventListener("click", () => {
  localStorage.removeItem("brushesOrder");
  swatchesData = {};
  createPalettes();
});

// ===== Buscador =====
const searchInput = document.getElementById("search");
searchInput.addEventListener("input", () => {
  const term = searchInput.value.trim().toLowerCase();
  document.querySelectorAll(".swatch").forEach(s => {
    s.classList.toggle("hidden", term && !s.dataset.name.includes(term));
  });
});

// ===== Descargar / Cargar JSON =====
document.getElementById("download").addEventListener("click", () => {
  const dataStr = JSON.stringify(swatchesData, null, 2);
  const blob = new Blob([dataStr], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "brushes_order.json";
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById("upload").addEventListener("click",
  () => document.getElementById("fileInput").click()
);
document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const data = JSON.parse(ev.target.result);
    createPalettes(data);
  };
  reader.readAsText(file);
});

// ===== Modo oscuro automático =====
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.body.classList.add("dark");
}

// ===== Inicializar =====
createPalettes(loadOrder());
