<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="./" />
  <link rel="icon" href="./../favicon.ico" sizes="any" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./../favicon.ico" sizes="any" type="image/svg+xml" />
  <link rel="manifest" href="./../manifest.webmanifest" />
  <link rel="styleSheet" href="./../styles/styles.css" type="text/css"/>

  <title>Círculo Cromático Interactivo</title>
  <link rel="styleSheet" href="./styles.css" type="text/css"/>
</head>

<body class="light">
  
  <header>
    <nav>
      <a class="btn btn-icon" href="./../" id="btn-main-menu">
        <img class="apps-icon pixel" src="./../favicon.ico" title="return to main menu"/>
        <span><</span>
      </a>
    </nav>
    <div class="mini-app-name">
      <span class="apps-icon">📚</span>
      <h1>Ms Colors Organizer</h1>
    </div>
  </header>
  
  
  <div class="container">
  
    <div class="tooltip" id="tooltip"></div>
  
    <section class="gray-cont">
      <h2>🖤 Grises</h2>
      <div class="list" id="grayList"></div>
    </section>
  
    <section class="chromatic fill-flex">
      <h2>🌈 Círculo Cromático</h2>
      <div class="chr-settings">
        <label>
          <span>Tamaño de círculo</span>
          <div class="row">
            <span>10</span>
            <input id="dot-radius" type="range" value="15" min="10" max="40" step="5" />
            <span>40</span>
          </div>
        </label>
        <label>
          <span>Niveles</span>
          <div class="row">
            <span>0</span>
            <input id="levels" type="range" value="0" min="0" max="15" step="1" />
            <span>15</span>
          </div>
        </label>
        <label>
          <span>Sectores</span>
          <div class="row">
            <span>6</span>
            <input id="sectors" type="range" value="3" min="6" max="18" step="3" />
            <span>18</span>
          </div>
        </label>
      </div>
  
      <div class="chr-container">
        <div class="circle-container levels-container" id="levelsContainer"></div>
        <svg class="circle-container sector-container" id="sectorSvg"></svg>
        <div class="circle-container" id="circleContainer"></div>
      </div>
  
      <div class="chr-selected fill-flex">
        <h3>Sección seleccionada</h3>
        <div class="list" id="colorList"></div>
      </div>
    </section>
  
  </div>
  <script src="./script.js"></script>
</body>
  
</html>
